name: Build and Deploy Resume PDF

on:
  push:
    paths:
      - 'Sandesh_Sawane_Resume.tex'
  pull_request:
    paths:
      - 'Sandesh_Sawane_Resume.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Sandesh_Sawane_Resume.tex

      - name: Commit and push compiled PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mv Sandesh_Sawane_Resume.pdf resume.pdf
          git add resume.pdf
          git commit -m "Auto-compile resume.pdf [skip ci]" || echo "No changes to commit"
          git push
